name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cospace
          POSTGRES_USER: cospace
          POSTGRES_PASSWORD: cospace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cospace -d cospace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cospace:cospace@localhost:5432/cospace
      JWT_ACCESS_SECRET: ci-access-secret-000000000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-00000000000000000000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_VENUE_TIMEZONE: America/Bogota
      NEXT_PUBLIC_VENUE_CURRENCY: COP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations
        run: bun run db:migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
