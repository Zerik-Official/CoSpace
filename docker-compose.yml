services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cospace
      POSTGRES_USER: cospace
      POSTGRES_PASSWORD: cospace
    ports:
      - "5433:5432"
    volumes:
      - cospace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cospace -d cospace"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cospace:cospace@db:5432/cospace
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cospace-postgres:
